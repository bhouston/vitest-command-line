name: CI

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev, main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:workflow
      - run: pnpm lint
      - run: pnpm test:types
      - run: pnpm test --coverage
      - run: pnpm audit --audit-level=high
      - name: Package size budget
        run: |
          pnpm size 2>&1 | tee size-report.txt
          cat size-report.txt >> "$GITHUB_STEP_SUMMARY"
      - run: pnpm package:check
      - uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            coverage/
            size-report.txt
      - name: Upload coverage
        uses: codecov/codecov-action@v5
        with:
          files: coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  policy:
    name: PR policy
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v5
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Validate squash commit title and workflow
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE: ${{ github.base_ref }}
          PR_HEAD: ${{ github.head_ref }}
          PR_HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
          PR_REPO: ${{ github.repository }}
        run: |
          printf '%s\n' "$PR_TITLE" | pnpm exec commitlint
          node scripts/check-pr-policy.mjs
